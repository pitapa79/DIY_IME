[package]
name = "diy-ime2-core"
default-run = "diy-ime2"
version = "0.1.0"
edition = "2024"
publish = false
description = "DIY_IME2 の文章候補データと変換エンジン"

[features]
# Matched control builds for the local Windows distribution comparison.
compiled-module-jit-baseline = []

[dependencies]
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

diy-ime2-runtime = { path = "crates/runtime" }

[workspace]
resolver = "3"
members = ["crates/runtime"]
default-members = [".", "crates/runtime"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Memory"] }
# Internal transport/control fixture. The explicit distribution bin list never ships it.
[[bin]]
name = "diy-ime2-test-host"
path = "tests/support/host.rs"
