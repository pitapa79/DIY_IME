[package]
name = "diy-ime2-tsf"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "diy_ime2_tsf"
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows = { version = "=0.58.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
] }
windows-core = "=0.58.0"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dev-dependencies]
windows = { version = "=0.58.0", features = ["Win32_UI_WindowsAndMessaging"] }
