name: Security regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-core-editor:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install project Rust
        run: |
          rustup toolchain install 1.90.0-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.90.0-x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustup which rustc
          $toolchain = Split-Path (Split-Path $compiler)
          $linker = Join-Path $toolchain 'lib/rustlib/x86_64-pc-windows-gnu/bin/self-contained/x86_64-w64-mingw32-gcc.exe'
          if (-not (Test-Path -LiteralPath $linker)) { throw 'Project GNU linker unavailable' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Rust contracts and examples
        run: |
          cargo test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --doc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Actual AppContainer Worker canaries
        run: |
          cargo build --locked --example appcontainer_worker_probe --example worker_pipe_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/debug/examples/appcontainer_worker_probe.exe canary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/debug/examples/appcontainer_worker_probe.exe timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/debug/examples/worker_pipe_probe.exe suite
          exit $LASTEXITCODE
      - name: Install Wasm test target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.90.0-x86_64-pc-windows-gnu
      - name: Real v3 Wasm ownership and policy
        run: ./scripts/check-wasm-v3.ps1
      - name: Node-independent Core boundary
        run: ./scripts/check-core-boundary.ps1
      - name: Build actual Editor Hosts
        run: |
          cargo build --locked --bin diy-ime2 --example execution_broker_gate --example execution_transport_fixtures
          exit $LASTEXITCODE
      - name: Install locked Editor dependencies
        working-directory: editor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          exit $LASTEXITCODE
      - name: Editor regression
        working-directory: editor
        run: |
          npm test -- --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      # Separate real-process checks: no retry hides a failure.
      - name: Repeat external Host lifecycle canary
        working-directory: editor
        run: |
          for ($trial = 1; $trial -le 3; $trial++) {
            Write-Output "External Host lifecycle trial $trial / 3"
            npm test -- tests/external-real.test.ts -t 'executes a consented installed package' --maxWorkers=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Dependency advisories
        run: ./scripts/security-audit.ps1
      - name: Build standalone Windows application
        run: |
          $nodeRoot = Split-Path (Get-Command node).Source
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'target/tools/wasmtime50/wasmtime-v50.0.1-x86_64-windows-c-api'
          ./scripts/build-windows-distribution.ps1 -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'target/windows-app') -NodeRuntimeRoot $nodeRoot -WasmtimeRoot $runtimeRoot -SourceCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Built application and launcher ownership
        run: |
          node scripts/check-windows-distribution.mjs (Join-Path $env:GITHUB_WORKSPACE 'target/windows-app')
          exit $LASTEXITCODE
      - name: Bundled graph latency measurement (smoke only)
        run: |
          node --test scripts/benchmark-windows-application.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/benchmark-windows-application.mjs (Join-Path $env:GITHUB_WORKSPACE 'target/windows-app') --samples 6 --warmups 0 | Set-Content target/windows-latency-smoke.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/benchmark-windows-application.mjs (Join-Path $env:GITHUB_WORKSPACE 'target/windows-app') --samples 6 --warmups 0 --trace 2 | Set-Content target/windows-detailed-trace-smoke.json -Encoding utf8
          exit $LASTEXITCODE
      - name: Adjacent OFF and basic trace comparison smoke
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import {benchmark} from './scripts/benchmark-windows-application.mjs'; const report=await benchmark({folder:'target/windows-app',samples:2,warmups:0,pollMs:5,trace:0,pairedGroups:1}); assert.equal(report.pairs.length,2); assert.equal(report.diagnostics[1].recordings,3); assert.equal(report.checks.trueClose,true);"
          exit $LASTEXITCODE
      - name: Synthetic dictionary scale diagnostic
        run: |
          $result = node scripts/benchmark-windows-application.mjs target/windows-app --samples 6 --warmups 0 --trace 2 --synthetic-rows 1000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = $result | ConvertFrom-Json
          if ($report.provenance.syntheticDictionary.rows -ne 1000 -or -not $report.checks.trueClose) { throw 'Synthetic dictionary run incomplete' }
          @{dictionary=$report.provenance.syntheticDictionary;prepareMs=$report.lifecycle.prepareMs;activateMs=$report.lifecycle.activateMs;latency=$report.summary;phases=$report.diagnostics.phaseSummary;dropped=$report.diagnostics.dropped} | ConvertTo-Json -Depth 8
      - name: Sequential and paced input smoke
        run: |
          $result = node scripts/benchmark-windows-application.mjs target/windows-app --host-input-rounds 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = $result | ConvertFrom-Json
          if ($report.formatVersion -ne 2 -or $report.scenarios.Count -ne 3 -or $report.scenarios[0].correct -ne 7 -or -not $report.checks.trueClose -or -not $report.checks.allCallbacksEnded -or -not $report.checks.staleResultsSuppressed) { throw 'Incomplete Host input smoke' }
          foreach ($scenario in $report.scenarios) {
            if ($scenario.attempts -ne 7 -or $scenario.failed -or $scenario.timedOut -or $scenario.cancelled -or $scenario.correct + $scenario.superseded -ne 7 -or $scenario.byCase.'dictionary-hit'.correct -ne 1) { throw 'Unexpected Host input outcome' }
          }
          # check-external-host holds a real Worker across invalidation to test supersession.
          $result | Set-Content target/windows-host-input-smoke.json -Encoding utf8
      - name: Prepared JIT Winch compilation comparison
        env:
          DIY_EXPERIMENT_PREPARED_JIT: '1'
        run: |
          cargo build --locked --release --features winch-serial-probe --bin diy-ime2-wasm-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $workers = [ordered]@{
            latency = 'target/windows-app/bin/diy-ime2-wasm-worker.exe'
            'serial-winch' = 'target/release/diy-ime2-wasm-worker.exe'
          }
          foreach ($variant in $workers.Keys) {
            node scripts/benchmark-wasm-host-scaling.mjs target/windows-app/bin/diy-ime2-external-host.exe target/debug/diy-ime2-node-package.exe $workers[$variant] target/windows-app/runtime/wasmtime.dll target/wasm32-unknown-unknown/release/diyime2_fixture_guest.wasm 150 2 single-detailed | Set-Content "target/windows-prepared-jit-$variant.json" -Encoding utf8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $workerHashes = foreach ($variant in $workers.Keys) {
            $report = Get-Content "target/windows-prepared-jit-$variant.json" -Raw | ConvertFrom-Json
            $scenario = $report.scenarios[0]
            if ($scenario.records.Count -ne 151 -or $scenario.preparedWorkers -lt 1) { throw "Incomplete Prepared JIT run ($variant)" }
            Write-Host (@{variant=$variant;samples=$report.samples;preparedWorkers=$scenario.preparedWorkers;hostMinusGuestCallUs=$scenario.hostMinusGuestCallUs;workerCleanupUs=$scenario.workerCleanupUs} | ConvertTo-Json -Depth 4)
            $report.workerSha256
          }
          if ($workerHashes[0] -eq $workerHashes[1]) { throw 'Expected two different Worker builds' }
          cargo test --locked -p diy-ime2-core --lib measure_code_acl_and_profile_cleanup -- --ignored --nocapture
          exit $LASTEXITCODE
      - name: Prepared JIT fixed-cadence comparison
        run: |
          $node = (Get-Command node -CommandType Application).Source
          foreach ($mode in @('1', 'all')) {
            $env:DIY_EXPERIMENT_PREPARED_JIT = $mode
            $env:DIY_WASM_SCALING_REPORT_PATH = "target/windows-prepared-jit-paced-$mode.json"
            python scripts/measure-windows-benchmark-job.py --command "target/windows-prepared-jit-paced-$mode.job.json" $node scripts/benchmark-wasm-host-scaling.mjs target/windows-app/bin/diy-ime2-external-host.exe target/debug/diy-ime2-node-package.exe target/windows-app/bin/diy-ime2-wasm-worker.exe target/windows-app/runtime/wasmtime.dll target/wasm32-unknown-unknown/release/diyime2_fixture_guest.wasm 5 6 paced
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Test-Path -LiteralPath $env:DIY_WASM_SCALING_REPORT_PATH)) { throw "Missing fixed-cadence report ($mode)" }
          }
      - name: Preserve verified Windows application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-application-${{ github.sha }}
          path: |
            target/windows-app.zip
            target/windows-app/bundle-manifest.json
            target/windows-latency-smoke.json
            target/windows-detailed-trace-smoke.json
            target/windows-host-input-smoke.json
            target/windows-prepared-jit-latency.json
            target/windows-prepared-jit-serial-winch.json
            target/windows-prepared-jit-paced-*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve synthetic compiler comparison canaries
        run: |
          $files = @('target/debug/examples/wasm_v3_probe.exe','target/wasm32-unknown-unknown/release/diyime2_fixture_guest.wasm')
          $hashes = @($files | ForEach-Object { @{path=$_;sha256=(Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()} })
          @{source=$env:GITHUB_SHA;syntheticOnly=$true;files=$hashes} | ConvertTo-Json -Depth 5 | Set-Content target/compiler-comparison-provenance.json -Encoding utf8
          $off = Get-Content target/windows-latency-smoke.json -Raw | ConvertFrom-Json
          $detailed = Get-Content target/windows-detailed-trace-smoke.json -Raw | ConvertFrom-Json
          @{kind='compiler-candidate-smoke-only';source=$env:GITHUB_SHA;off=$off.summary;detailed=$detailed.summary;phases=$detailed.diagnostics.phaseSummary;dropped=$detailed.diagnostics.dropped;checks=$detailed.checks} | ConvertTo-Json -Depth 8
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wasm-compiler-canaries-${{ github.sha }}
          path: |
            target/debug/examples/wasm_v3_probe.exe
            target/wasm32-unknown-unknown/release/diyime2_fixture_guest.wasm
            target/compiler-comparison-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Record source and binary provenance
        if: always()
        run: |
          "## Verification provenance" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          rustc --version >> $env:GITHUB_STEP_SUMMARY
          node --version >> $env:GITHUB_STEP_SUMMARY
          foreach ($path in @('Cargo.lock','editor/package-lock.json','target/debug/diy-ime2.exe','target/debug/examples/execution_broker_gate.exe','target/debug/examples/execution_transport_fixtures.exe')) {
            if (Test-Path -LiteralPath $path) {
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              "$path SHA256 $hash" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          if (Test-Path -LiteralPath 'target/security-audit/summary.json') {
            Get-Content target/security-audit/summary.json >> $env:GITHUB_STEP_SUMMARY
          }
